name: diag-v841
on:
  workflow_dispatch:
  push:
    paths: ['tools/diag_v841.py']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/diag_v841.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DIAG_OCR_V841.txt
          git commit -m 'Diagnostic OCR V8.41' || exit 0
          git push