name: Audit Trung tam AI
on:
  push:
    paths:
      - '.github/workflows/audit-center.yml'
      - 'tools/audit_center.py'
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static audit
        run: python tools/audit_center.py || true
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUDIT_REPORT.md
          git commit -m "Audit Trung tam AI current version" || exit 0
          git push
