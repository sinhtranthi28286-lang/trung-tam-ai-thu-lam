name: Apply Trung tam AI V8.28
on:
  push:
    paths:
      - '.github/workflows/apply-v828.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/patch_v828.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v825/part*.txt
          git commit -m "Update Trung tam AI V8.28: recognize trolyAI_tranthisinh as admin" || exit 0
          git push