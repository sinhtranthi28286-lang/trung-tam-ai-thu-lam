name: Apply Party flag fix
on:
  push:
    paths:
      - 'tools/patch_v843_flag.py'
      - 'assets/co-dang-chuan.b64.part*'
      - 'assets/co-dang-chuan.png'
      - '.github/workflows/apply-v843-flag.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rebuild exact Party flag and patch app
        run: python tools/patch_v843_flag.py
      - name: Commit generated app and exact PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v825/part*.txt assets/co-dang-chuan.png
          git diff --cached --quiet || git commit -m 'V8.47 restore exact Party flag image'
          git push
