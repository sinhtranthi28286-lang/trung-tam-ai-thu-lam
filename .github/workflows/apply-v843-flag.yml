name: Apply V8.43 Party flag
on:
  push:
    paths:
      - 'tools/patch_v843_flag.py'
      - 'assets/co-dang-chuan.svg'
      - '.github/workflows/apply-v843-flag.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply flag-only patch
        run: python tools/patch_v843_flag.py
      - name: Commit generated app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v825/part*.txt
          git diff --cached --quiet || git commit -m 'V8.43 update Party flag visual only'
          git push
