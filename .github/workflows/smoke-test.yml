name: Smoke Test Trung tam AI
on:
  push:
    paths:
      - '.github/workflows/smoke-test.yml'
      - 'tools/smoke_test.mjs'
permissions:
  contents: write
jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1
      - run: npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run browser smoke test
        run: node tools/smoke_test.mjs > SMOKE_REPORT.json || true
      - name: Commit smoke report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SMOKE_REPORT.json
          git commit -m "Browser smoke test Trung tam AI V8.30" || exit 0
          git push