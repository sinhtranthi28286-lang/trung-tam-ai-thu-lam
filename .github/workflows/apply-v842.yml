name: Apply V8.42 free OCR
on:
  push:
    paths:
      - 'tools/patch_v842.py'
      - '.github/workflows/apply-v842.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_v842.py
      - run: python tools/audit_center.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html v825/part*.txt
          git commit -m 'V8.42 free PDF OCR reader' || exit 0
          git push