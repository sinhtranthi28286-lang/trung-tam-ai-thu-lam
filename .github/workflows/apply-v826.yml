name: Apply Trung tam AI V8.26

on:
  push:
    paths:
      - '.github/workflows/apply-v826.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch_v826.py
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v825/part*.txt
          git commit -m "Update Trung tam AI V8.26: output files and document lookup" || exit 0
          git push
