<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xuất lưu trữ văn bản</title><style>body{font-family:Segoe UI,Arial;margin:0;background:#f6f7f9;color:#222}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 10px 30px #0001}h1{color:#991b1b;font-size:24px}.warn{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:10px;margin:14px 0}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.run{background:#991b1b;color:#fff}.back{background:#e5e7eb}.status{margin-top:14px;font-weight:600;white-space:pre-wrap}label{display:block;margin:12px 0}</style></head><body><div class="wrap"><div class="card"><h1>📦 Xuất lưu trữ & dọn dung lượng</h1><p id="who">Đang kiểm tra quyền...</p><p>File trong kho online: <b id="count">—</b></p><div class="warn">Hệ thống sẽ tạo một file ZIP gồm toàn bộ văn bản và <b>Danh_muc_van_ban.csv</b>. Sau khi ZIP được tạo và bắt đầu tải xuống, file vật lý online sẽ bị xóa để giảm dung lượng. Tên văn bản và lịch sử theo dõi vẫn được giữ.</div><label><input id="ok" type="checkbox"> Tôi đã hiểu và sẽ lưu giữ file ZIP trên máy tính.</label><button class="run" id="run">Xuất ZIP và xóa file online</button> <button class="back" onclick="history.back()">Quay lại</button><div class="status" id="status"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>const P='uycbkcdmkxgbbdqjyqpt',K='sb_publishable_wWNfjRlqokiDKgTotNHKyQ_STmCTKSd',U='https://'+P+'.supabase.co',F=U+'/functions/v1/archive-documents',sb=supabase.createClient(U,K);let token='',n=0;const $=id=>document.getElementById(id),msg=(s,b=false)=>{ $('status').textContent=s;$('status').style.color=b?'#b91c1c':'#166534'};async function api(action,x={}){const r=await fetch(F,{method:'POST',headers:{'content-type':'application/json','apikey':K,'authorization':'Bearer '+token},body:JSON.stringify({action,...x})});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'Lỗi máy chủ');return j}function q(s){return '"'+String(s??'').replaceAll('"','""')+'"'}async function init(){const {data}=await sb.auth.getSession();token=data.session?.access_token||'';if(!token){$('who').textContent='Bạn chưa đăng nhập Trung tâm AI.';$('run').disabled=true;return}try{const s=await api('status');n=s.count||0;$('count').textContent=n;$('who').textContent='Đã xác nhận quyền quản trị lưu trữ.'}catch(e){$('who').textContent=e.message;$('run').disabled=true}}$('run').onclick=async()=>{if(!$('ok').checked)return msg('Vui lòng tích xác nhận trước khi xuất.',true);$('run').disabled=true;try{msg('Đang lập danh sách file...');const p=await api('prepare'),fs=p.files||[];if(!fs.length)return msg('Kho không có file để xuất.');if(fs.some(f=>!f.signed_url))throw Error('Có file không tạo được liên kết tải. Chưa xóa file nào.');const z=new JSZip(),csv=[['STT','Tên file','Cập nhật','Đường dẫn lưu trữ'].map(q).join(',')];for(let i=0;i<fs.length;i++){const f=fs[i];msg('Đang lấy file '+(i+1)+'/'+fs.length+': '+f.file_name);const r=await fetch(f.signed_url);if(!r.ok)throw Error('Không tải được '+f.file_name+'. Chưa xóa file nào.');z.file('Van_ban/'+String(i+1).padStart(4,'0')+'_'+f.file_name.replace(/[\\/:*?"<>|]/g,'_'),await r.blob());csv.push([i+1,f.file_name,f.updated_at,f.storage_path].map(q).join(','))}z.file('Danh_muc_van_ban.csv','\ufeff'+csv.join('\r\n'));msg('Đang đóng gói ZIP...');const b=await z.generateAsync({type:'blob',compression:'DEFLATE'}),a=document.createElement('a'),url=URL.createObjectURL(b),d=new Date();a.href=url;a.download='Luu_tru_van_ban_Thu_Lam_'+d.toISOString().slice(0,10)+'.zip';a.click();await new Promise(r=>setTimeout(r,1200));msg('Đang xóa file vật lý online...');const del=await api('delete',{storage_paths:fs.map(f=>f.storage_path)});$('count').textContent=Math.max(0,n-(del.deleted||0));msg('Hoàn tất: đã xuất '+fs.length+' file và xóa '+del.deleted+' file online. Hãy giữ file ZIP vừa tải.');setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){msg(e.message,true)}finally{$('run').disabled=false}};init();</script></body></html>
