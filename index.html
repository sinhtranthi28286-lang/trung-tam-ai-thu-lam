>Yêu cầu hoặc lưu ý của lãnh đạo (nếu có)<textarea id=\"ttMergeNote\" rows=\"3\" placeholder=\"Ví dụ: Chỉ ban hành 01 kế hoạch chung; phân rõ nhiệm vụ từng cơ quan...\"></textarea></label></div>'+\n    '<div class=\"tt-tool-actions\"><button class=\"tt-tool-secondary\" onclick=\"closeTTTool()\">Đóng</button><button class=\"tt-tool-primary\" onclick=\"launchTTMerge()\">📋 Sao chép câu lệnh & mở ChatGPT</button></div>';\n  }else{\n   title.textContent='🎨 Tạo ảnh tuyên truyền từ văn bản';\n   body.innerHTML='<div class=\"tt-tool-note\"><b>Cách sử dụng:</b> Chọn văn bản nguồn. Khi ChatGPT mở, tải tệp lên rồi dán câu lệnh. Ảnh phải dùng đúng nội dung văn bản, chữ tiếng Việt rõ ràng và không tự thêm số liệu, thời gian hoặc căn cứ.</div>'+\n    '<div class=\"tt-tool-form\"><label>Mục đích<select id=\"ttImgPurpose\"><option>Infographic tuyên truyền</option><option>Ảnh trình bày tại hội nghị</option><option>Ảnh thông báo nội bộ</option><option>Ảnh đăng mạng xã hội</option></select></label>'+\n    '<label>Đối tượng tiếp nhận<select id=\"ttImgAudience\"><option>Cán bộ, đảng viên</option><option>Cấp ủy, tổ chức đảng</option><option>Nhân dân</option><option>Cán bộ chuyên môn</option></select></label>'+\n    '<label class=\"full\">Chọn văn bản mới<input id=\"ttImgFile\" type=\"file\" accept=\".pdf,.doc,.docx\" onchange=\"showTTFiles(this,\\'ttImgName\\')\"><div id=\"ttImgName\" class=\"tt-tool-files\">Chưa chọn tệp.</div></label>'+\n    '<label>Khổ ảnh<select id=\"ttImgSize\"><option>Dọc - infographic</option><option>Ngang - màn hình trình chiếu</option><option>Vuông - mạng xã hội</option></select></label>'+\n    '<label>Phong cách<select id=\"ttImgStyle\"><option>Trang trọng, hiện đại, màu đỏ - vàng</option><option>Hành chính, rõ ràng, ít trang trí</option><option>Trực quan, dễ đọc, nhiều biểu tượng</option></select></label>'+\n    '<label class=\"full\">Nội dung cần nhấn mạnh (nếu có)<textarea id=\"ttImgNote\" rows=\"3\" placeholder=\"Ví dụ: làm nổi bật thời gian, đối tượng, nhi y định.\\n5. Chỉ sử dụng thông tin trong tài liệu. Thiếu ghi [CẦN BỔ SUNG], mâu thuẫn ghi [CẦN KIỂM TRA]. Không tự tạo căn cứ, số liệu, tên người hoặc thời hạn.\\n6. Cuối dự thảo lập mục NỘI DUNG CẦN CÁN BỘ KIỂM TRA TRƯỚC KHI TRÌNH KÝ.\\n\\nAI chỉ hỗ trợ tham mưu; cán bộ chịu trách nhiệm kiểm tra và quyết định văn bản chính thức.';\n  copyOpen(p);\n };\n window.launchTTImage=function(){\n  const inp=document.getElementById('ttImgFile'),file=inp.files&&inp.files[0];\n  if(!file)return alert('Hãy chọn văn bản nguồn.');\n  const purpose=document.getElementById('ttImgPurpose').value,audience=document.getElementById('ttImgAudience').value,size=document.getElementById('ttImgSize').value,style=document.getElementById('ttImgStyle').value,note=document.getElementById('ttImgNote').value.trim();\n  const p='Đọc kỹ văn bản tôi tải lên: '+file.name+'. Hãy tạo 01 '+purpose+' phục vụ '+audience+'.\\n\\nYÊU CẦU NỘI DUNG:\\n- Chỉ lấy thông tin có trong văn bản; không tự thêm số liệu, căn cứ, thời gian, địa điểm hoặc tên người.\\n- Chọn tiêu đề ngắn gọn; rút 4-6 nội dung quan trọng nhất; ưu tiên đối tượng, nhiệm vụ, thời gian, cách thực hiện và yêu cầu cần nhớ.\\n- Trước khi tạo ảnh, hãy đưa bản tóm tắt chữ để tôi kiểm tra. Chỉ tạo ảnh sau khi tôi xác nhận nội dung.\\n\\nYÊU CẦU THIẾT KẾ:\\n- Khổ ảnh: '+size+'.\\n- Phong cách: '+style+'.\\n- Bố cục giống tinh thần ảnh thông tin hội nghị: tiêu đề lớn, các khối nội dung rõ ràng, biểu tượng phù hợp, màu sắc trang trọng; chữ tiếng Việt đầy đủ dấu, dễ đọc.\\n- Không dùng logo, hình chân dung hoặc biểu tượng cơ quan nếu văn bản không yêu cầu; không chèn nội dung không có trong nguồn.\\n'+(note?'NỘI DUNG CẦN NHẤN MẠNH: '+note+'\\n':'')+'\\nSau khi tôi duyệt phần chữ, hãy dùng công cụ tạo ảnh để xuất hình hoàn chỉnh, không watermark.';\n  copyOpen(p);\n };\n})();\n<\\/script>";
