<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trung tâm AI - Ban Xây dựng Đảng xã Thư Lâm</title>
<style>
html,body{margin:0;height:100%;font-family:Segoe UI,Arial,sans-serif;background:#991b16;color:#fff}
#loading{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.box{max-width:520px}.spinner{width:38px;height:38px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading"><div class="box"><div class="spinner"></div><b>Đang mở Trung tâm AI...</b><div id="msg" style="margin-top:10px;font-size:13px;opacity:.85"></div></div></div>
<script>
(async()=>{
  try{
    const files=[1,2,3,4,5,6,7,8,9].map(n=>'v825/part'+String(n).padStart(2,'0')+'.txt');
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f+'?v=852',{cache:'no-store'});
      if(!r.ok) throw new Error('Không tải được '+f+' ('+r.status+')');
      return (await r.text()).trim();
    }));
    const b64=parts.join('');
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    let html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
    try{
      const raw=localStorage.getItem('sb-uycbkcdmkxgbbdqjyqpt-auth-token');
      const ses=raw?JSON.parse(raw):null;
      const jwt=ses?.access_token||ses?.currentSession?.access_token||'';
      const sub=jwt?JSON.parse(atob(jwt.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub:'';
      if(sub==='f6f11290-9000-4623-84a2-f5132f737808'){
        const link='<a href="archive.html" title="Xuất lưu trữ và dọn dung lượng" style="position:fixed;right:18px;bottom:18px;z-index:2147483000;background:#991b1b;color:#fff;text-decoration:none;border-radius:12px;padding:11px 15px;font:700 14px Segoe UI,Arial;box-shadow:0 8px 24px rgba(0,0,0,.22)">📦 Xuất & dọn kho</a>';
        html=html.replace('</body>',link+'</body>');
      }
    }catch{}
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('msg').textContent='Lỗi tải ứng dụng: '+e.message;}
})();
</script>
</body>
</html>
